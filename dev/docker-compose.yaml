services:
  postgres:
    container_name: ${CONTAINER_NAME}
    image: ${POSTGRES_IMAGE}
    user: postgres
    environment:
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - LANG=${DB_LOCALE}
      - LC_COLLATE=${DB_LOCALE}
      - LC_CTYPE=${DB_LOCALE}
    command: "-c max_connections=200"
    ports:
      - 127.0.0.1:${LOCAL_PORT}:5432

  oracle:
    container_name: ${ORACLE_CONTAINER_NAME}
    image: ${ORACLE_IMAGE}
    environment:
      - ORACLE_PWD=${ORACLE_PASSWORD}
    ports:
      - 127.0.0.1:${ORACLE_PORT}:1521
      - 127.0.0.1:5500:5500
    shm_size: 1g
